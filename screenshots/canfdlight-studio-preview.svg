<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#10192e" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)" />

  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="490" x2="1200" y2="490" />
    <line x1="0" y1="560" x2="1200" y2="560" />
    <line x1="0" y1="630" x2="1200" y2="630" />
  </g>

  <!-- Top Navigation Header -->
  <rect x="30" y="25" width="1140" height="60" rx="12" fill="#10192e" stroke="#2a3b61" stroke-width="1" />
  <circle cx="55" cy="55" r="8" fill="#ef4444" />
  <circle cx="75" cy="55" r="8" fill="#f59e0b" />
  <circle cx="95" cy="55" r="8" fill="#10b981" />
  <text x="125" y="60" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">CANFDLightForge Pro</text>
  <text x="320" y="60" fill="#94a3b8" font-family="monospace" font-size="13">CiA 604-1 CAN FD Light Studio &amp; Matrix Lighting Auditor [v1.0.0]</text>
  <rect x="940" y="38" width="210" height="34" rx="6" fill="#080d1a" stroke="#10b981" stroke-width="1" />
  <text x="955" y="60" fill="#10b981" font-family="monospace" font-size="12" font-weight="600">● 10/10 PASS Normative</text>

  <!-- Left Column: Synthesizer & Waveform -->
  <rect x="30" y="105" width="550" height="565" rx="12" fill="#10192e" stroke="#1e293b" stroke-width="1" />
  <text x="50" y="140" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="700">Lighting &amp; Actuator Transmission Parameters</text>

  <!-- Form Fields -->
  <rect x="50" y="165" width="160" height="50" rx="8" fill="#1a2744" stroke="#2a3b61" stroke-width="1" />
  <text x="65" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">Node Role</text>
  <text x="65" y="205" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="600">COMMANDER</text>

  <rect x="225" y="165" width="180" height="50" rx="8" fill="#1a2744" stroke="#2a3b61" stroke-width="1" />
  <text x="240" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">CAN Identifier</text>
  <text x="240" y="205" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="600">0x120 (Headlamp)</text>

  <rect x="420" y="165" width="140" height="50" rx="8" fill="#1a2744" stroke="#2a3b61" stroke-width="1" />
  <text x="435" y="185" fill="#94a3b8" font-family="sans-serif" font-size="11">Frame Format</text>
  <text x="435" y="205" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="600">11-Bit (IDE=0)</text>

  <rect x="50" y="225" width="245" height="50" rx="8" fill="#1a2744" stroke="#2a3b61" stroke-width="1" />
  <text x="65" y="245" fill="#94a3b8" font-family="sans-serif" font-size="11">Nominal Phase Bitrate</text>
  <text x="65" y="265" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="600">1 Mbit/s (1000 kbps)</text>

  <rect x="315" y="225" width="245" height="50" rx="8" fill="#1a2744" stroke="#2a3b61" stroke-width="1" />
  <text x="330" y="245" fill="#94a3b8" font-family="sans-serif" font-size="11">Data Phase Bitrate (BRS=1)</text>
  <text x="330" y="265" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="600">5.0 Mbit/s High-Speed</text>

  <!-- Dual-Phase Timeline Bar -->
  <text x="50" y="305" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">Dual-Phase Bitrate Switch Timeline (43.4 us Frame)</text>
  <rect x="50" y="320" width="510" height="55" rx="8" fill="#000000" stroke="#1e293b" stroke-width="1" />

  <!-- Segments: Nominal Header (17b ~ 70px), Fast Data (128b ~ 320px), CRC-17 (17b ~ 70px), EOF (50px) -->
  <g transform="translate(50, 320)">
    <!-- Nominal Header -->
    <rect x="0" y="0" width="80" height="55" fill="#6366f1" />
    <text x="12" y="26" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">SOF+ID</text>
    <text x="10" y="44" fill="#e0e7ff" font-family="monospace" font-size="9">1 Mbps</text>

    <!-- Fast Data -->
    <rect x="80" y="0" width="270" height="55" fill="#38bdf8" />
    <text x="120" y="26" fill="#000000" font-family="monospace" font-size="11" font-weight="bold">DATA PHASE (16 Bytes)</text>
    <text x="145" y="44" fill="#0f172a" font-family="monospace" font-size="9">5.0 Mbps (BRS=1)</text>

    <!-- CRC-17 -->
    <rect x="350" y="0" width="80" height="55" fill="#10b981" />
    <text x="365" y="26" fill="#000000" font-family="monospace" font-size="10" font-weight="bold">CRC-17</text>
    <text x="365" y="44" fill="#064e3b" font-family="monospace" font-size="9">17 Bits</text>

    <!-- Passive ACK & EOF -->
    <rect x="430" y="0" width="80" height="55" fill="#334155" />
    <text x="442" y="26" fill="#f8fafc" font-family="monospace" font-size="9">PASSIVE ACK</text>
    <text x="455" y="44" fill="#94a3b8" font-family="monospace" font-size="9">EOF/IFS</text>
  </g>

  <!-- Metrics Box -->
  <rect x="50" y="405" width="510" height="175" rx="8" fill="#1a2744" stroke="#2a3b61" stroke-width="1" />
  <text x="65" y="435" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Protocol Conformance &amp; Lighting Refresh Metrics</text>
  
  <text x="65" y="465" fill="#94a3b8" font-family="monospace" font-size="11">Total Duration: <tspan fill="#38bdf8">43.4 us (182 Bits)</tspan> | Refresh Frequency: <tspan fill="#10b981">&gt; 200 Hz (Zero Flicker)</tspan></text>
  <text x="65" y="490" fill="#94a3b8" font-family="monospace" font-size="11">Architecture: <tspan fill="#38bdf8">Commander/Responder</tspan> | Multi-Master Arbitration: <tspan fill="#10b981">ELIMINATED</tspan></text>
  <text x="65" y="515" fill="#94a3b8" font-family="monospace" font-size="11">ACK Slot: <tspan fill="#10b981">Passive (Zero Loop Delay)</tspan> | Oscillator: <tspan fill="#10b981">On-Chip RC Compliant</tspan></text>
  <text x="65" y="540" fill="#94a3b8" font-family="monospace" font-size="11">CRC Algorithm: <tspan fill="#10b981">CRC-17 (0x0146C)</tspan> | Stuff Count: <tspan fill="#f59e0b">Gray Code Valid</tspan></text>
  <text x="65" y="565" fill="#94a3b8" font-family="sans-serif" font-size="10">Cost Reduction: Eliminates quartz crystals on all satellite LED drivers ($0.40-$0.80 BOM saved/node)</text>

  <rect x="50" y="605" width="510" height="45" rx="8" fill="url(#primary)" />
  <text x="180" y="633" fill="#000000" font-family="sans-serif" font-size="14" font-weight="700">Synthesize &amp; Audit CAN FD Light Frame</text>

  <!-- Right Column: 10-Point Normative Auditor -->
  <rect x="610" y="105" width="560" height="565" rx="12" fill="#10192e" stroke="#1e293b" stroke-width="1" />
  <text x="635" y="140" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="700">CiA 604-1 Normative Architectural Auditor</text>
  <text x="635" y="160" fill="#94a3b8" font-family="sans-serif" font-size="11">Automotive Lighting &amp; Actuation Conformance Suite</text>

  <!-- 10 Rules -->
  <g transform="translate(635, 175)">
    <!-- Rule 1 -->
    <rect x="0" y="0" width="510" height="38" rx="6" fill="#1a2744" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="19" r="7" fill="#10b981" />
    <text x="16" y="23" fill="#080d1a" font-family="sans-serif" font-size="10" font-weight="bold">✓</text>
    <text x="40" y="23" fill="#f8fafc" font-family="monospace" font-size="12">RULE-CFDL-01: Commander/Responder Non-Contention [PASS]</text>

    <!-- Rule 2 -->
    <rect x="0" y="44" width="510" height="38" rx="6" fill="#1a2744" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="63" r="7" fill="#10b981" />
    <text x="16" y="67" fill="#080d1a" font-family="sans-serif" font-size="10" font-weight="bold">✓</text>
    <text x="40" y="67" fill="#f8fafc" font-family="monospace" font-size="12">RULE-CFDL-02: Zero Acknowledge (ACK) Slot Operation [PASS]</text>

    <!-- Rule 3 -->
    <rect x="0" y="88" width="510" height="38" rx="6" fill="#1a2744" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="107" r="7" fill="#10b981" />
    <text x="16" y="111" fill="#080d1a" font-family="sans-serif" font-size="10" font-weight="bold">✓</text>
    <text x="40" y="111" fill="#f8fafc" font-family="monospace" font-size="12">RULE-CFDL-03: Nominal Phase Bitrate (500/1000 kbps) [PASS]</text>

    <!-- Rule 4 -->
    <rect x="0" y="132" width="510" height="38" rx="6" fill="#1a2744" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="151" r="7" fill="#10b981" />
    <text x="16" y="155" fill="#080d1a" font-family="sans-serif" font-size="10" font-weight="bold">✓</text>
    <text x="40" y="155" fill="#f8fafc" font-family="monospace" font-size="12">RULE-CFDL-04: Data Phase Bitrate Compliance (5 Mbps) [PASS]</text>

    <!-- Rule 5 -->
    <rect x="0" y="176" width="510" height="38" rx="6" fill="#1a2744" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="195" r="7" fill="#10b981" />
    <text x="16" y="199" fill="#080d1a" font-family="sans-serif" font-size="10" font-weight="bold">✓</text>
    <text x="40" y="199" fill="#f8fafc" font-family="monospace" font-size="12">RULE-CFDL-05: CAN FD Frame Indicator (FDF=1) [PASS]</text>

    <!-- Rule 6 -->
    <rect x="0" y="220" width="510" height="38" rx="6" fill="#1a2744" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="239" r="7" fill="#10b981" />
    <text x="16" y="243" fill="#080d1a" font-family="sans-serif" font-size="10" font-weight="bold">✓</text>
    <text x="40" y="243" fill="#f8fafc" font-family="monospace" font-size="12">RULE-CFDL-06: Payload DLC &amp; Length Conformance [PASS]</text>

    <!-- Rule 7 -->
    <rect x="0" y="264" width="510" height="38" rx="6" fill="#1a2744" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="283" r="7" fill="#10b981" />
    <text x="16" y="287" fill="#080d1a" font-family="sans-serif" font-size="10" font-weight="bold">✓</text>
    <text x="40" y="287" fill="#f8fafc" font-family="monospace" font-size="12">RULE-CFDL-07: Dual CRC Selection (CRC-17/21) [PASS]</text>

    <!-- Rule 8 -->
    <rect x="0" y="308" width="510" height="38" rx="6" fill="#1a2744" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="327" r="7" fill="#10b981" />
    <text x="16" y="331" fill="#080d1a" font-family="sans-serif" font-size="10" font-weight="bold">✓</text>
    <text x="40" y="331" fill="#f8fafc" font-family="monospace" font-size="12">RULE-CFDL-08: Stuff Count Gray Code Parity [PASS]</text>

    <!-- Rule 9 -->
    <rect x="0" y="352" width="510" height="38" rx="6" fill="#1a2744" stroke="#10b981" stroke-width="1" />
    <circle cx="20" cy="371" r="7" fill="#10b981" />
    <text x="16" y="375" fill="#080d1a" font-family="sans-serif" font-size="10" font-weight="bold">✓</text>
    <text x="40" y="375" fill="#f8fafc" font-family="monospace" font-size="12">RULE-CFDL-09: Responders Edge Clock Sync [PASS]</text>

    <!-- Rule 10 -->
    <rect x="0" y="396" width="510" height="38" rx="6" fill="#1a2744" stroke="#38bdf8" stroke-width="1" />
    <circle cx="20" cy="415" r="7" fill="#38bdf8" />
    <text x="16" y="419" fill="#080d1a" font-family="sans-serif" font-size="10" font-weight="bold">i</text>
    <text x="40" y="419" fill="#f8fafc" font-family="monospace" font-size="12">RULE-CFDL-10: Lighting Latency (&lt; 250 us) [PASS]</text>
  </g>

  <!-- Bottom Strip -->
  <rect x="635" y="630" width="510" height="30" rx="6" fill="#1a2744" stroke="#2a3b61" stroke-width="1" />
  <text x="645" y="650" fill="#94a3b8" font-family="monospace" font-size="11">CiA 604-1: Commander/Responder | Passive ACK | CRC-17/21 | 1/5 Mbps | Crystal-less</text>
</svg>
